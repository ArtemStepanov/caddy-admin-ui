name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: CGO_ENABLED=1 go build -v ./cmd/server

      - name: Test
        run: go test -v -race -coverprofile=coverage.out ./cmd/... ./internal/...

      - name: Lint
        run: go vet ./cmd/... ./internal/...

      - name: Start real Caddy for integration tests
        run: >-
          docker run --name caddy-admin-ui-integration -d
          -p 127.0.0.1:2019:2019
          -v "$PWD/internal/caddy/testdata/integration.json:/etc/caddy/integration.json:ro"
          caddy:2.11.4-alpine caddy run --config /etc/caddy/integration.json

      - name: Wait for Caddy Admin API
        run: timeout 30 sh -c 'until curl --fail --silent http://127.0.0.1:2019/config/ >/dev/null; do sleep 1; done'

      - name: Caddy integration test
        env:
          CADDY_INTEGRATION_URL: http://127.0.0.1:2019
        run: go test -v -tags=integration ./internal/caddy

      - name: Caddy integration logs
        if: failure()
        run: docker logs caddy-admin-ui-integration

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: caddy-admin-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
