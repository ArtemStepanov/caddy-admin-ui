name: Feature request
description: Propose a focused product improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Caddy ownership and safety impact
      description: Which config scope changes, and how should unsupported data and drift be handled?
    validations:
      required: true
