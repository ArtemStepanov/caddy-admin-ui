name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Follow SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.2.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: topology
    attributes:
      label: Deployment and Caddy topology
      description: Include Docker/native setup, Caddy version, and whether the server was imported or bootstrapped.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted logs or JSON
      render: shell
