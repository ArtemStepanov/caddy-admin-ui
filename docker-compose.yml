services:
  # Caddy Admin UI
  admin-ui:
    image: ghcr.io/artemstepanov/caddy-admin-ui:latest
    # build: .  # uncomment for local development
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - CADDY_ADMIN_URL=http://caddy:2019
      - DB_PATH=/app/data/routes.db
      - LISTEN_ADDR=0.0.0.0:3000
      # Safe because the published UI port above is loopback-only.
      - ALLOW_INSECURE_NO_AUTH=true
    volumes:
      - admin-ui-data:/app/data
    depends_on:
      - caddy
    restart: unless-stopped

  # Test Caddy instance
  caddy:
    image: caddy:2.11.4-alpine
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    restart: unless-stopped

configs:
  caddyfile:
    content: |
      {
        admin 0.0.0.0:2019
      }

      app.localhost {
        reverse_proxy http://admin-ui:3000
      }

      files.localhost {
        root * /usr/share/caddy
        file_server
      }

      readonly.localhost {
        respond "Preserved read-only route"
      }

volumes:
  admin-ui-data:
  caddy-data:
  caddy-config:
