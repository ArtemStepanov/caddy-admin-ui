services:
  # Caddy Admin UI
  orchestrator:
    image: ghcr.io/artemstepanov/caddy-admin-ui:latest
    # build: .  # uncomment for local development
    ports:
      - "3000:3000"
    environment:
      - CADDY_ADMIN_URL=http://caddy:2019
      - DB_PATH=/app/data/routes.db
    volumes:
      - orchestrator-data:/app/data
    depends_on:
      - caddy
    restart: unless-stopped

  # Test Caddy instance
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    restart: unless-stopped

configs:
  caddyfile:
    content: |
      {
        admin 0.0.0.0:2019
      }

      app.localhost {
        reverse_proxy http://orchestrator:3000
      }

      files.localhost {
        root * /usr/share/caddy
        file_server
      }

      readonly.localhost {
        respond "Preserved read-only route"
      }

volumes:
  orchestrator-data:
  caddy-data:
  caddy-config:
